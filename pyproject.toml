[project]
name = "few-shot-anomaly-poc"
version = "0.1.0"
description = "A preregistered CPU-only proof of concept for few-shot visual anomaly detection."
readme = "README.md"
requires-python = "==3.13.14"
license = { file = "LICENSE" }
dependencies = [
    "numpy==2.5.1",
    "opencv-python-headless==4.13.0.92",
    "scikit-image==0.26.0",
    "scikit-learn==1.9.0",
]

[project.scripts]
few-shot-data = "few_shot_anomaly_poc.cli:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.0",
]

[tool.uv]
required-version = "==0.11.32"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
