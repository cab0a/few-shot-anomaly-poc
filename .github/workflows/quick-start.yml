name: Quick Start

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quick-start:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Synchronize locked environment
        run: uv sync --locked

      - name: Run README Quick Start
        run: |
          uv run --locked --no-sync python scripts/verify_environment.py
          quick_start_root="$(mktemp -d)"
          uv run --locked --no-sync python scripts/run_synthetic_evaluation.py \
            --output-root "${quick_start_root}"
          test -s "${quick_start_root}/synthetic-e2e/artifact-manifest.json"
          test -s "${quick_start_root}/synthetic-e2e/ecc_residual/metrics.json"
          test -s "${quick_start_root}/synthetic-e2e/patch_hog_one_class_svm/metrics.json"
          uv run --locked --no-sync python scripts/render_v0_1_summary.py
          git diff --exit-code -- docs/assets/v0.1-gate-summary.svg
