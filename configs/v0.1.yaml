{
  "schema_version": "v0.1",
  "dataset": {
    "name": "VisA",
    "category": "pcb1",
    "license": "CC BY 4.0",
    "archive": {
      "identifier": "VisA_20220922.tar",
      "url": "https://amazon-visual-anomaly.s3.us-west-2.amazonaws.com/VisA_20220922.tar",
      "expected_sha256": null
    },
    "split": {
      "repository": "https://github.com/amazon-science/spot-diff",
      "revision": "2a692ab575001cbde74d402d897a7286086c6199",
      "path": "split_csv/1cls.csv",
      "url": "https://raw.githubusercontent.com/amazon-science/spot-diff/2a692ab575001cbde74d402d897a7286086c6199/split_csv/1cls.csv",
      "sha256": "a48557e6033318cb90556f706196bc9d247a776a23ea51aecee5a80dd0332995"
    }
  },
  "selection": {
    "reference_count": 20,
    "seed": 42,
    "procedure_version": "sha256-path-ranking-v1",
    "namespace": "few-shot-anomaly-poc:v0.1"
  },
  "preprocessing": {
    "decode_mode": "grayscale_uint8_ignore_orientation",
    "output_height": 512,
    "output_width": 512,
    "resize_interpolation": "area",
    "output_dtype": "float32",
    "scale_divisor": 255.0
  },
  "ecc_registration": {
    "motion_model": "euclidean",
    "initial_warp": "identity_2x3",
    "termination": "count_plus_epsilon",
    "max_iterations": 100,
    "epsilon": 0.000001,
    "gaussian_filter_size": 5,
    "warp_interpolation": "linear",
    "mask_interpolation": "nearest",
    "warp_border": "constant_zero",
    "max_abs_rotation_degrees": 10.0,
    "max_abs_horizontal_translation_pixels": 64.0,
    "max_abs_vertical_translation_pixels": 64.0,
    "min_valid_fraction": 0.80
  },
  "ecc_template": {
    "anchor_selection": "first_unicode_path",
    "minimum_successful_references": 16,
    "support_mask": "intersection",
    "support_erosion_kernel_size": 5,
    "support_erosion_iterations": 1,
    "support_erosion_border": "constant_zero",
    "minimum_support_fraction": 0.75,
    "aggregation": "pixelwise_median_valid_values"
  },
  "ecc_residual_scoring": {
    "validity_erosion_kernel_size": 5,
    "validity_erosion_iterations": 1,
    "validity_erosion_border": "constant_zero",
    "minimum_effective_support_fraction": 0.95,
    "residual": "absolute_grayscale",
    "gaussian_kernel_size": 5,
    "gaussian_sigma": 0.0,
    "gaussian_border": "constant_zero",
    "top_fraction": 0.01,
    "top_count_rounding": "ceil",
    "failure_score": 1.0
  },
  "patch_hog": {
    "patch_height": 64,
    "patch_width": 64,
    "vertical_stride": 32,
    "horizontal_stride": 32,
    "vertical_positions": 15,
    "horizontal_positions": 15,
    "patch_count": 225,
    "ordering": "row_major",
    "orientations": 9,
    "pixels_per_cell_height": 16,
    "pixels_per_cell_width": 16,
    "cells_per_block_height": 2,
    "cells_per_block_width": 2,
    "block_norm": "L2-Hys",
    "transform_sqrt": true,
    "visualize": false,
    "feature_vector": true,
    "channel_axis": "none",
    "descriptor_length": 324,
    "output_dtype": "float32"
  },
  "patch_hog_scaler": {
    "reference_order": "unicode_path",
    "fitting_scope": "per_patch_position",
    "copy": true,
    "with_mean": true,
    "with_std": true
  },
  "patch_hog_one_class_svm": {
    "fitting_scope": "per_patch_position",
    "kernel": "rbf",
    "gamma": "scale",
    "nu": 0.05,
    "tolerance": 0.001,
    "shrinking": true,
    "cache_size_mb": 200.0,
    "max_iterations": -1,
    "verbose": false
  },
  "patch_hog_scoring": {
    "patch_score": "negative_decision_function",
    "maximum_absolute_patch_score_exclusive": 1000000000000.0,
    "aggregation": "mean_top_fraction",
    "top_fraction": 0.05,
    "top_count_rounding": "ceil",
    "failure_score": 1000000000000.0
  },
  "threshold_calibration": {
    "source_partition": "calibration",
    "normal_only": true,
    "method_scope": "per_method",
    "score_order": "ascending",
    "quantile": 0.95,
    "rank_rounding": "ceil",
    "threshold_index": "rank_minus_one",
    "prediction_rule": "failed_or_strictly_greater"
  },
  "paths": {
    "archive": "data/external/archives/VisA_20220922.tar",
    "archive_provenance": "data/provenance/visa-archive.json",
    "extracted": "data/external/visa",
    "extraction_provenance": "data/provenance/visa-extraction.json",
    "split_csv": "data/external/splits/visa-1cls.csv",
    "split_provenance": "data/provenance/visa-split.json",
    "manifest_dir": "data/manifests/v0.1"
  }
}
